server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # never fall back to index.html for API calls: 404 keeps Axios on the mock data
  location /api/ {
    return 404;
  }

  location ~* \.(js|css|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
